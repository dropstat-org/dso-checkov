  - CKV_AWS_145   # S3 KMS encryption — SSE-S3 sufficient for dev
  - CKV_AWS_21    # S3 versioning — not required for transient data
  - CKV2_AWS_62   # S3 MFA delete — not required in dev

  # ── Secrets Manager ───────────────────────────────────────────────────────
