  - CKV_AWS_150   # ALB deletion protection — not required in dev
  - CKV_AWS_91    # ALB access logs — log bucket setup deferred
  - CKV2_AWS_28   # ALB WAFv2 — not required in non-prod
  - CKV_AWS_378   # ALB HTTP protocol — HTTP listener used for redirect in internal ALB
  - CKV2_AWS_20   # ALB HTTP redirects to HTTPS — deferred until HTTPS configured

  # ── Security Groups ───────────────────────────────────────────────────────
  - CKV_AWS_382   # SG egress 0.0.0.0/0 — intentional for ECS tasks pulling ECR images
  - CKV2_AWS_5    # SG not attached to resource — false positive on module SGs

  # ── ECS ───────────────────────────────────────────────────────────────────
  - CKV_AWS_336   # ECS read-only root filesystem — not supported by all services
  - CKV_AWS_65    # ECS exec logging — deferred

