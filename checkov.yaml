# Checkov exceptions for dropstat SonarQube (dropstat-aws-ecs-sonar-qube)
# Repo:   dropstat-org/dropstat-aws-ecs-sonar-qube
# Branch: release/dropstat-sonarqube
#
# SonarQube interno en shared-services: ECS Fargate + EFS + RDS PostgreSQL,
# ALB INTERNO (HTTP, acceso solo via VPN/TGW). Excepciones justificadas para una
# herramienta interna de bajo riesgo. Cargado automaticamente por el pipeline.

skip-check:
  # -- ALB interno (HTTP, sin exposicion a internet) --------------------------
  - CKV_AWS_2     # ALB listener HTTPS -- ALB interno HTTP, HTTPS diferido (acceso via VPN)
  - CKV_AWS_103   # ALB TLS 1.2 -- sin TLS (HTTP interno)
  - CKV_AWS_378   # ALB target group HTTP -- interno
  - CKV2_AWS_20   # ALB redirect HTTP->HTTPS -- HTTP-only interno
  - CKV2_AWS_28   # WAFv2 -- no aplica a ALB interno
  - CKV_AWS_150   # ALB deletion protection -- no requerido
  - CKV_AWS_91    # ALB access logs -- diferido
  - CKV_AWS_131   # ALB drop HTTP headers -- interno

  # -- Security Groups --------------------------------------------------------
  - CKV_AWS_382   # SG egress 0.0.0.0/0 -- necesario (pull ECR, RDS, NFS via egress)
  - CKV2_AWS_5    # SG no attached -- falso positivo (los SG se usan cross-modulo)

  # -- RDS PostgreSQL (tool interno) ------------------------------------------
  - CKV_AWS_157   # RDS multi-AZ -- single-AZ a proposito
  - CKV_AWS_293   # RDS deletion protection -- no requerido
  - CKV_AWS_118   # RDS enhanced monitoring
  - CKV_AWS_129   # RDS log exports
  - CKV_AWS_161   # RDS IAM auth
  - CKV_AWS_353   # RDS performance insights
  - CKV_AWS_354   # RDS performance insights CMK
  - CKV2_AWS_30   # RDS Postgres query logging
  - CKV2_AWS_60   # RDS copy tags to snapshots

  # -- Encriptacion por CMK (default AWS-managed aceptable para tool interno) --
  - CKV_AWS_158   # CloudWatch Log Group CMK
  - CKV_AWS_149   # Secrets Manager CMK
  - CKV_AWS_224   # ECS cluster logging CMK
  - CKV_AWS_184   # EFS CMK

  # -- Logs / secrets (tool interno) ------------------------------------------
  - CKV_AWS_338   # CloudWatch retencion >= 1 anio -- 30d suficiente
  - CKV2_AWS_57   # Secrets Manager rotacion automatica -- no configurada

  # -- ECS --------------------------------------------------------------------
  - CKV_AWS_336   # readonly root filesystem -- SonarQube necesita FS de escritura
